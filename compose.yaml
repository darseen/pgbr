x-shared-env: &shared-env
  DATABASE_URL: postgres://root:password@pgbr_db:5432/pgbr
  PGBR_DATA: /var/lib/pgbr/data
  ENCRYPTION_KEY: sjDvhC0lj8l3KQDUZDrlcqBQcdfeQGHbyOLOOQhNpaQ=
  REDIS_URL: redis://redis:6379

services:
  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile.dev
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      <<: *shared-env
      NEXT_TELEMETRY_DISABLED: 1
      AUTH_SECRET: 3nC4dwLT/+COH6g+CqXwzZI6p6MmB3/5g0xvWzROYFc=
    volumes:
      - pgbr:/var/lib/pgbr/data

    depends_on:
      pgbr_db:
        condition: service_healthy
      test_db1:
        condition: service_healthy
      test_db2:
        condition: service_healthy
      redis:
        condition: service_healthy

    develop:
      watch:
        - action: sync
          path: ./apps/dashboard
          target: /app/apps/dashboard
          ignore:
            - node_modules/
            - .next/

        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

        - action: rebuild
          path: ./apps/dashboard/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile.dev
    container_name: worker
    environment:
      <<: *shared-env
    volumes:
      - pgbr:/var/lib/pgbr/data

    depends_on:
      pgbr_db:
        condition: service_healthy
      redis:
        condition: service_healthy

    develop:
      watch:
        - action: sync
          path: ./apps/worker
          target: /app/apps/worker
          ignore:
            - node_modules/
            - dist/

        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

        - action: rebuild
          path: ./apps/worker/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  pgbr_db:
    image: postgres:18-alpine
    container_name: pgbr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d pgbr" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgbr_db:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test_db1:
    image: postgres:18-alpine
    container_name: test_db1
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr_test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d pgbr_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_db1:/var/lib/postgresql/data

  test_db2:
    image: postgres:18-alpine
    container_name: test_db2
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr_test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d pgbr_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_db2:/var/lib/postgresql/data

volumes:
  pgbr:
  pgbr_db:
  test_db1:
  test_db2:
