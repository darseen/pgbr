x-shared-env: &shared-env
  DATABASE_URL: postgres://root:password@pgbr_db:5432/pgbr
  ENCRYPTION_KEY: sjDvhC0lj8l3KQDUZDrlcqBQcdfeQGHbyOLOOQhNpaQ=
  STORAGE_ENDPOINT: http://seaweedfs:8333
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: pgbr
  STORAGE_ACCESS_KEY_ID: pgbr
  STORAGE_SECRET_ACCESS_KEY: pgbrsecret
  STORAGE_FORCE_PATH_STYLE: "true"

services:
  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile.dev
    container_name: dashboard
    ports:
      - "3000:3000"
    environment:
      <<: *shared-env
      NEXT_TELEMETRY_DISABLED: 1
      AUTH_SECRET: 3nC4dwLT/+COH6g+CqXwzZI6p6MmB3/5g0xvWzROYFc=

    depends_on:
      pgbr_db:
        condition: service_healthy
      test_db1:
        condition: service_healthy
      test_db2:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

    develop:
      watch:
        - action: sync
          path: ./apps/dashboard
          target: /app/apps/dashboard
          ignore:
            - node_modules/
            - .next/

        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

        - action: rebuild
          path: ./apps/dashboard/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile.dev
    container_name: worker
    environment:
      <<: *shared-env

    depends_on:
      pgbr_db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

    develop:
      watch:
        - action: sync
          path: ./apps/worker
          target: /app/apps/worker
          ignore:
            - node_modules/
            - dist/

        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

        - action: rebuild
          path: ./apps/worker/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  pgbr_db:
    image: postgres:18-alpine
    container_name: pgbr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d pgbr"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgbr_db:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0"
    ports:
      - "8333:8333"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:9333/cluster/healthz || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - seaweedfs_data:/data

  test_db1:
    image: postgres:18-alpine
    container_name: test_db1
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d pgbr_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_db1:/var/lib/postgresql/data

  test_db2:
    image: postgres:18-alpine
    container_name: test_db2
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d pgbr_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - test_db2:/var/lib/postgresql/data

volumes:
  seaweedfs_data:
  pgbr_db:
  test_db1:
  test_db2:
