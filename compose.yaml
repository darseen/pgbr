services:
  postgres:
    image: postgres:18-alpine
    container_name: pgbr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: pgbr_test
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  pgbr:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pgbr_service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://root:password@postgres:5432/pgbr_test
      - PGBR_DATA=/var/lib/pgbr/data
      - NEXT_TELEMETRY_DISABLED=1
      - BASE_URL=http://localhost:3000
      - AUTH_SECRET=secret
    volumes:
      - pgbr:/var/lib/pgbr/data

    depends_on:
      postgres:
        condition: service_started

    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/

        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  pgbr:
  postgres:
