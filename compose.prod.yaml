name: pgbr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-shared-env: &shared-env
  # Password must be URL-safe, or URL-encode it here.
  DATABASE_URL: postgres://${POSTGRES_USER:-pgbr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@pgbr_db:5432/${POSTGRES_DB:-pgbr}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env — generate with openssl rand -base64 32}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-pgbr}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-pgbr}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-pgbrsecret}
  STORAGE_FORCE_PATH_STYLE: "${STORAGE_FORCE_PATH_STYLE:-true}"

services:
  dashboard:
    image: ghcr.io/darseen/pgbr-dashboard:${PGBR_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *shared-env
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — generate with openssl rand -base64 32}
      BASE_URL: ${BASE_URL:?set BASE_URL in .env — the URL you open in the browser}
    ports:
      - "${PGBR_BIND_ADDR:-0.0.0.0}:${PGBR_PORT:-3000}:3000"
    depends_on:
      pgbr_db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [frontend, backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  worker:
    image: ghcr.io/darseen/pgbr-worker:${PGBR_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      <<: *shared-env
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-5}"
    depends_on:
      # Waits for the dashboard's entrypoint to finish migrations.
      dashboard:
        condition: service_healthy
      pgbr_db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    # Long enough for in-flight pg_dump/pg_restore jobs to drain on shutdown.
    stop_grace_period: 300s
    networks: [frontend, backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  pgbr_db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pgbr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pgbr}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pgbr} -d ${POSTGRES_DB:-pgbr}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - pgbr_db:/var/lib/postgresql/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Default object store. Unauthenticated by design — never publish its port.
  # Drop this service when STORAGE_* points at another S3-compatible store.
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.40}
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:9333/cluster/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - seaweedfs_data:/data
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgbr_db:
  seaweedfs_data:
